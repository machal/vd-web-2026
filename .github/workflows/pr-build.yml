name: PR Build

on:
  pull_request:
    branches: [master, main]

jobs:
  build-monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & build both apps
        run: |
          npm ci
          npx turbo run build --filter=@vd/vzhurudolu --filter=@vd/michalek-dev
          test -d apps/vzhurudolu/dist/_astro
          test -f apps/michalek-dev/dist/index.html
          test -f apps/michalek-dev/dist/martin/index.html
          bash scripts/verify-phase1-build.sh
          bash scripts/verify-phase5-english-scaffold.sh
          bash scripts/verify-phase6-content-pairing-i18n-seo.sh
          bash scripts/verify-phase8-launch-polish.sh

      # Optional Phase 3 link gate (D-08) — linkinator@7.6.1 via verify script --links-only; full gate local/merge (needs network)
      - name: Link check (Phase 3)
        run: bash scripts/verify-phase3-parity.sh --links-only
