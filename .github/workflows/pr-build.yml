name: PR Build

on:
  pull_request:
    branches: [master, main]

jobs:
  build-vzhurudolu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & build
        run: |
          npm ci
          npx turbo run build --filter=@vd/vzhurudolu
          test -d apps/vzhurudolu/dist/_astro
          bash scripts/verify-phase1-build.sh

      # Optional Phase 3 link gate (D-08) — linkinator@7.6.1 via verify script --links-only; full gate local/merge (needs network)
      - name: Link check (Phase 3)
        run: bash scripts/verify-phase3-parity.sh --links-only
