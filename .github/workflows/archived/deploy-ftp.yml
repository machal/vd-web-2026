# ARCHIVED Phase 9 — full FTP auto-deploy workflow (push to main/master)
# Restore to .github/workflows/deploy-ftp.yml per docs/ROLLBACK.md §2
# GitHub secrets required: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

name: Deploy na FTP (archived auto-deploy)

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & build
        run: |
          npm ci
          npx turbo run build --filter=@vd/vzhurudolu
          test -d apps/vzhurudolu/dist/_astro
          bash scripts/verify-phase1-build.sh

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/vzhurudolu/dist/
          server-dir: www/project/
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/data/**
            **/files/**
          # protocol: ftps
          # port: 990
